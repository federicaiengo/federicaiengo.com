name: Source preflight (no deployment)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-preflight.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render social preview required by asset checks
        run: |
          python3 -m venv /tmp/fi-social-venv
          /tmp/fi-social-venv/bin/pip install --quiet cairosvg
          /tmp/fi-social-venv/bin/python -c "import cairosvg; cairosvg.svg2png(url='public/social-preview.svg', write_to='public/social-preview.png', output_width=1200, output_height=630)"
      - name: Run source, reference and visual audits
        run: |
          python3 scripts/audit_site_source.py
          python3 scripts/audit_site_references.py
          python3 scripts/audit_visual_assets.py
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install dependencies using lockfile when available
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No committed package-lock.json; using npm install until lockfile PR is merged"
            npm install --no-audit --no-fund
          fi
      - name: Verify Astro build
        run: npm run build
