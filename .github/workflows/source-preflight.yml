name: Source preflight (no deployment)
on:
  # Self-hosted safety: never run untrusted public pull requests.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-preflight.yml'
permissions:
  contents: read
jobs:
  source-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, federica-home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render social preview required by asset checks
        shell: pwsh
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='public/social-preview.svg', write_to='public/social-preview.png', output_width=1200, output_height=630)"
      - name: Run source, reference and visual audits
        run: |
          python scripts/audit_site_source.py
          python scripts/audit_site_references.py
          python scripts/audit_visual_assets.py
          python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies from reviewed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify Astro build
        run: npm run build
