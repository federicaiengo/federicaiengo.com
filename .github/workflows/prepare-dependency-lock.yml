name: Prepare reproducible dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, federica-home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies into a genuine npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation from generated lockfile
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run source and reference audits
        run: |
          python scripts/audit_site_source.py
          python scripts/audit_site_references.py
          python scripts/audit_visual_assets.py
          python -m unittest discover -s scripts/tests -v
      - name: Verify Astro build
        run: npm run build
      - name: Upload generated lockfile for independent review
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-for-review
          path: package-lock.json
          if-no-files-found: error
