name: Prepare reproducible dependency lock
on:
  workflow_dispatch:
  # One explicit repository request can prepare a reviewable lockfile PR.
  # This workflow never deploys the public site.
  push:
    branches: [main]
    paths:
      - '.github/lockfile-prepare-request.txt'
permissions:
  contents: write
  pull-requests: write
jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies into a genuine npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Run source and reference audits
        run: |
          python3 scripts/audit_site_source.py
          python3 scripts/audit_site_references.py
          python3 scripts/audit_visual_assets.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Verify Astro build
        run: npm run build
      - name: Upload generated lockfile for independent review
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-for-review
          path: package-lock.json
          if-no-files-found: error
      - name: Propose tested lockfile in a pull request (no deploy)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: package-lock.json
          branch: ci/reproducible-dependencies
          delete-branch: true
          commit-message: 'build: add npm dependency lockfile'
          title: 'build: commit verified npm lockfile'
          body: |
            Generated by npm on Node 24.
            Verified with npm ci, source audits, unit tests, and Astro build.
            Review before merging. This workflow does not deploy the site.
