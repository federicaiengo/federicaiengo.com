name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  # A deploy runs on push ONLY when this dedicated request file changes.
  # Normal source commits do not publish the site.
  push:
    branches:
      - main
    paths:
      - '.github/pages-deploy-request.txt'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, federica-home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render the canonical SVG social card to its LinkedIn-compatible PNG
        shell: pwsh
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='public/social-preview.svg', write_to='public/social-preview.png', output_width=1200, output_height=630)"
      - name: Validate official FI icon and social assets
        run: |
          python scripts/audit_site_source.py
          python scripts/audit_site_references.py
          python scripts/audit_visual_assets.py
          python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Windows, X64, federica-home]
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
