name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  # A deploy runs on push ONLY when this dedicated request file changes.
  # Normal source commits do not publish the site.
  push:
    branches:
      - main
    paths:
      - '.github/pages-deploy-request.txt'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, federica-home]
    env:
      PSExecutionPolicyPreference: Bypass
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify dedicated Federica site runner identity
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows home runner required' }
          if ($env:RUNNER_NAME -ne 'federica-site-pc') { throw "Wrong runner: $env:RUNNER_NAME" }
          Write-Host 'PASS: Federica personal site runner verified'
      - uses: actions/checkout@v4
      - name: Prepare isolated Python environment from an existing local installation
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'federica-site-venv'
          $candidates = @(
            @{ Executable = 'python'; Prefix = @() },
            @{ Executable = 'py'; Prefix = @('-3.13') },
            @{ Executable = 'py'; Prefix = @('-3.12') },
            @{ Executable = 'py'; Prefix = @('-3.11') }
          )
          $ready = $false
          foreach ($candidate in $candidates) {
            if (-not (Get-Command $candidate.Executable -ErrorAction SilentlyContinue)) { continue }
            $probe = @($candidate.Prefix) + @('-c', 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 14)')
            & ($candidate.Executable) @probe 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $create = @($candidate.Prefix) + @('-m', 'venv', $venv)
            & ($candidate.Executable) @create
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
          }
          if (-not $ready) { throw 'Python 3.11-3.13 is not available to this runner; no global installation or elevation will be attempted' }
          $python = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Site venv Python missing' }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) { throw 'Site venv pip missing' }
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host 'PASS: isolated Federica site Python available'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies from reviewed lockfile
        run: npm ci --no-audit --no-fund
      - name: Render social preview using the pinned Sharp dependency
        run: |
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/social-preview.svg').resize(1200, 630).png().toFile('public/social-preview.png');"
      - name: Validate official FI icon and social assets
        run: |
          python scripts/audit_site_source.py
          python scripts/audit_site_references.py
          python scripts/audit_visual_assets.py
          python -m unittest discover -s scripts/tests -v
      - name: Verify Astro build
        run: npm run build
      - name: Expose existing Git for Windows Bash for Pages archive
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction Stop
          $gitRoot = Split-Path -Parent (Split-Path -Parent $git.Source)
          $candidates = @(
            (Join-Path $gitRoot 'bin\bash.exe'),
            'C:\Program Files\Git\bin\bash.exe',
            'C:\Program Files (x86)\Git\bin\bash.exe'
          )
          $bash = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $bash) { throw 'Git Bash is missing on the Federica runner; Pages upload cannot proceed safely' }
          $bashDir = Split-Path -Parent $bash
          & $bash --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash executable failed verification' }
          $env:PATH = "$bashDir;$env:PATH"
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host 'PASS: existing Git Bash enabled for Pages archive'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Windows, X64, federica-home]
    needs: build
    steps:
      - name: Verify dedicated Federica site runner identity
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows home runner required' }
          if ($env:RUNNER_NAME -ne 'federica-site-pc') { throw "Wrong deployment runner: $env:RUNNER_NAME" }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
